name: firmware

# Building firmware needs the submodules, which are large, so this is manual
# and on release tags rather than on every push.
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      device:
        description: Device from DEVICES in Platform/Features.py
        default: j414s
      without:
        description: Space-separated features to turn off
        default: ''

jobs:
  build:
    name: Build ${{ github.event.inputs.device || 'j414s' }} firmware
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        # Tools/build-windows-native.sh refuses anything but an Apple Silicon
        # macOS host: it uses clang-cl/lld-link from Homebrew LLVM and builds
        # EDK2 BaseTools natively.
        run: brew install llvm lld acpica nasm

      - name: Build and seal
        env:
          DEVICE: ${{ github.event.inputs.device || 'j414s' }}
          WITHOUT: ${{ github.event.inputs.without }}
        run: |
          set -eu
          args=""
          for feature in $WITHOUT; do args="$args --without $feature"; done
          sh Tools/mu-build "$DEVICE" $args

      - uses: actions/upload-artifact@v4
        with:
          name: mu-firmware-${{ github.event.inputs.device || 'j414s' }}
          path: |
            Build/**/FV/*.fd
            **/artifacts/manifest.json
          if-no-files-found: error
